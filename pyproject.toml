[project]
name = "notionit"
version = "0.2.0"
description = "A Python package for Notion API: Markdown to Notion uploader with full-featured support powered by Mistune."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mistune>=3.1.3",
    "requests>=2.25.0",
    "rich>=14.0.0",
    "typer>=0.12.0",
    "typing-extensions>=4.0.0",
]

[dependency-groups]
dev = ["pyright>=1.1.345", "pytest>=8.0.0", "ruff>=0.11.13"]

[project.scripts]
notionit = "notionit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notionit", "notionit.*"]

[tool.setuptools.package-data]
"notionit" = ["py.typed"]

[tool.pyright]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
ignore = ["build", "dist"]

[tool.pytest.ini_options]
markers = [
    "live: tests that call the real Notion API and create temporary pages",
]

[tool.uv]
package = true
